# Single source of truth for all 3 résumé variants (India / Australia / UK & Europe).
#
# This is the only place résumé facts get entered or corrected. Written against
# the confidence-graded evidence register in the private career-history document
# (Version 3, 11 Nov 2026); `register_id` traces each fact back to its register
# row. Two later corrections from the owner are also recorded here and are NOT
# yet in that document: OpenTelemetry was implemented for Kafka-as-a-Service
# observability, and OpenShift work is hands-on (Helm deployments, production
# troubleshooting, security-context hardening).
#
# R8 (Warehouse System) and R43 (awards) are "résumé-only" in the register and
# are used only in the register's own scoped wording (no dates or counts for
# awards). Nothing marked Open or Excluded appears. No headcounts anywhere.
#
# British/Australian spelling is used throughout; it is also normal in India.
#
# `tier` on a bullet controls which variants carry it:
#   1 = every variant
#   2 = fuller detail (shown wherever the variant's max_tier allows; today all three)
#   3 = Australia only (the longest format)
# Which sections each country shows, and in what order, lives in
# generate_resume.py (COUNTRIES), not here.

