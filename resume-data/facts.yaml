# Single source of truth for all 3 résumé variants (India / Australia / UK & Europe).
#
# This is the only place résumé facts get entered or corrected. Generated against
# the confidence-graded evidence register in the private career-history document
# (Version 3, 11 Nov 2026) — register IDs below trace each fact back to its
# register row, so any future correction starts here, not in the PDF or the site.
#
# Confidence key (as used in the register): Confirmed / Supported / Approximate /
# Résumé-only / Open / Excluded. Only Confirmed/Supported/Approximate facts are
# used verbatim below; nothing marked Résumé-only or Open appears here.
#
# `countries`: which résumé variants a fact appears in. Omit the key entirely for
# "all three". Values: india, australia, uk_europe.
#
# `priority` on an experience bullet: 1 = always included, 2 = trimmed first when
# a country's page-length convention is tighter (used for Australia/UK & Europe;
# India keeps every priority-1 and -2 bullet since a denser multi-page CV is
# acceptable there for 12+ years of experience).

